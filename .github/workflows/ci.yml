name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -v --cov=numguard --cov-report=term-missing
      - name: Self-check -- fixtures still demonstrate real naive-formula bugs
        run: python -m numguard.cli --check-naive-fails
      - name: Smoke-test installed console script
        run: |
          numguard --version
          numguard --help
          numguard --kernel variance --json | python -m json.tool > /dev/null

  build-artifact:
    name: build wheel + sdist + pyz
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Build standalone .pyz (zipapp)
        run: |
          python -m pip install --target build/pyz-deps .
          printf 'from numguard.cli import main\nif __name__ == "__main__":\n    raise SystemExit(main())\n' > build/pyz-deps/__main__.py
          python -m zipapp build/pyz-deps -o dist/numguard.pyz -p "/usr/bin/env python3"
      - name: Smoke-test the .pyz on this Linux runner
        run: |
          python3 dist/numguard.pyz --version
          python3 dist/numguard.pyz --kernel variance --json | python3 -m json.tool > /dev/null
          # Regression check: the .pyz's exit code must reflect the real
          # command result (self-check mode returns 1 on a real problem).
          set +e
          python3 dist/numguard.pyz --check-naive-fails > /dev/null 2>&1
          check_code=$?
          set -e
          test "$check_code" -eq 0
      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
