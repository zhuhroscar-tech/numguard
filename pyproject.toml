[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numguard"
version = "0.18.0"
description = "Audit naive vs numerically-stable ML math kernels (softmax, log-sum-exp, cross-entropy, variance, layer_norm, rms_norm, kl_divergence, online_softmax, masked_softmax, sum, rope_cos, int8_add, hll_register, focal_loss_grad, pearson_correlation, weighted_sampling_key, geometric_mean, p2_quantile, repetition_penalty, speculative_reject, weight_decay) against a high-precision reference"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "zhuhroscar-tech" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/zhuhroscar-tech/numguard"

[project.scripts]
numguard = "numguard.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
